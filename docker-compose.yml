version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lenny_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lenny_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lenny_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_PORT=8000
      - APP_HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/lenny_assistant
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-phi3}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-phi3}
      - LLM_FALLBACK_TO_LOCAL=${LLM_FALLBACK_TO_LOCAL:-true}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.90}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-6}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
